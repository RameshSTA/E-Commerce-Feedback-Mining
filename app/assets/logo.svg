<!-- app/assets/logo.svg -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECommerceFeedbackAI logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="20" y="20" width="216" height="216" rx="28" fill="url(#g1)" filter="url(#soft)"/>
  <rect x="32" y="32" width="192" height="192" rx="22" fill="#0F172A" opacity="0.9"/>

  <!-- cart glyph -->
  <g transform="translate(60,70)">
    <path d="M8 16 h28 l8 48 h60 l8-28 h-72" fill="none" stroke="url(#g2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="88" r="8" fill="#22C55E"/>
    <circle cx="104" cy="88" r="8" fill="#22C55E"/>
  </g>

  <!-- pulse / feedback bars -->
  <g transform="translate(150,64)">
    <rect x="0" y="0" width="10" height="40" rx="3" fill="#A5B4FC"/>
    <rect x="18" y="12" width="10" height="52" rx="3" fill="#60A5FA"/>
    <rect x="36" y="24" width="10" height="64" rx="3" fill="#22C55E"/>
  </g>
</svg>